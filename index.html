<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개성고 에코 게임관</title>
<meta name="description" content="개성고등학교 학생들이 만든 환경 게임 18편">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d;--bg2:#141418;--ink:#f4f1ea;--mute:#a7a29a;--line:rgba(255,255,255,.08);
  --accent:#e50914;--gold:#d8b46a;--shadow:0 24px 60px rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

#glow{position:fixed;left:0;top:0;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(229,9,20,.16),rgba(216,180,106,.06) 40%,transparent 70%);
  transform:translate(-50%,-50%);mix-blend-mode:screen}

nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:28px;padding:18px 4vw;
  background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);transition:background .3s}
nav.solid{background:rgba(11,11,13,.96);backdrop-filter:blur(8px)}
.logo{font-weight:900;letter-spacing:.02em;font-size:22px;color:var(--accent);text-shadow:0 0 24px rgba(229,9,20,.45)}
.logo small{display:block;font-size:10px;letter-spacing:.35em;color:var(--gold);font-weight:700}
nav .links{display:flex;gap:20px;font-size:14px;color:var(--mute)}
nav .links a:hover{color:var(--ink)}
nav .school{margin-left:auto;font-size:13px;color:var(--gold);border:1px solid rgba(216,180,106,.4);padding:6px 12px;border-radius:999px;white-space:nowrap}

.hero{position:relative;height:88vh;min-height:520px;overflow:hidden}
.hero-bg{position:absolute;inset:-4%;background-size:cover;background-position:center;transition:transform .2s ease-out,opacity .6s;will-change:transform}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(11,11,13,.95) 0%,rgba(11,11,13,.55) 45%,transparent 75%),linear-gradient(0deg,var(--bg) 0%,transparent 35%)}
.hero-copy{position:absolute;z-index:2;left:4vw;bottom:22vh;max-width:560px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.3em;color:var(--gold);font-weight:700;margin-bottom:14px}
.badge b{background:var(--accent);color:#fff;padding:2px 6px;letter-spacing:0;border-radius:2px}
.hero h1{font-size:clamp(30px,5vw,58px);font-weight:900;line-height:1.1;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.hero p{margin:16px 0 26px;color:#ddd6cb;font-size:clamp(14px,1.4vw,18px);line-height:1.6}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;border-radius:6px;font-weight:700;font-size:16px;transition:transform .2s,background .2s}
.btn.play{background:#fff;color:#000}.btn.play:hover{background:#e6e6e6;transform:scale(1.04)}
.btn.more{background:rgba(120,120,120,.45);color:#fff}.btn.more:hover{background:rgba(120,120,120,.7)}
.dots{position:absolute;z-index:2;right:4vw;bottom:22vh;display:flex;gap:6px}
.dots i{width:22px;height:3px;background:rgba(255,255,255,.3);cursor:pointer;transition:background .3s}
.dots i.on{background:var(--accent)}

main{position:relative;z-index:2;margin-top:-14vh;padding-bottom:60px}
.row{margin:0 0 30px}
.row h2{padding:0 4vw;font-size:clamp(17px,1.8vw,22px);font-weight:700;display:flex;align-items:baseline;gap:10px}
.row h2 span{font-size:12px;color:var(--gold);font-weight:500;opacity:0;transform:translateX(-6px);transition:.3s}
.row:hover h2 span{opacity:1;transform:none}
.track-wrap{position:relative}
.track{display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;padding:40px 4vw 50px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:40px;bottom:50px;width:4vw;min-width:36px;z-index:20;border:0;color:#fff;font-size:30px;cursor:pointer;
  background:rgba(11,11,13,.6);opacity:0;transition:opacity .3s}
.arrow.l{left:0}.arrow.r{right:0}
.track-wrap:hover .arrow{opacity:1}

.card{position:relative;flex:0 0 clamp(220px,22vw,320px);aspect-ratio:16/9;cursor:pointer;perspective:900px}
.card .inner{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:var(--bg2);box-shadow:0 6px 18px rgba(0,0,0,.5);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .6s,filter .4s}
.card .num{position:absolute;left:10px;top:8px;font-size:11px;font-weight:900;letter-spacing:.15em;color:var(--accent);
  background:rgba(0,0,0,.6);padding:2px 6px;border-radius:2px}
.card .shine{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 45%)}
.card .info{position:absolute;inset:auto 0 0 0;padding:34px 12px 10px;background:linear-gradient(0deg,rgba(0,0,0,.92),transparent)}
.card .t{font-size:14px;font-weight:700;line-height:1.3;text-shadow:0 1px 6px #000}
.card .d{font-size:12px;color:#cfc8bd;margin-top:4px;max-height:0;overflow:hidden;opacity:0;transition:max-height .35s,opacity .35s}
.card .go{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;max-height:0;opacity:0;overflow:hidden;transition:max-height .35s,opacity .35s,margin .35s}
.card .go i{width:24px;height:24px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-style:normal;font-size:10px}
.card:hover{z-index:10}
.card:hover .inner{transform:scale(1.28) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:var(--shadow),0 0 0 1px rgba(216,180,106,.4)}
.card:hover img{transform:scale(1.06);filter:saturate(1.15)}
.card:hover .shine{opacity:1}
.card:hover .d{max-height:60px;opacity:1}
.card:hover .go{max-height:30px;opacity:1;margin-top:8px}
.track .card:first-child .inner{transform-origin:left center}
.track .card:last-child .inner{transform-origin:right center}

.rank .card{flex-basis:clamp(240px,24vw,340px);margin-left:clamp(56px,6vw,96px)}
.rank .card::before{content:attr(data-rank);position:absolute;right:100%;bottom:-16px;margin-right:-16px;font-size:clamp(110px,12vw,170px);font-weight:900;line-height:1;
  color:var(--bg);-webkit-text-stroke:3px #5c5852;letter-spacing:-.08em;transition:-webkit-text-stroke-color .3s}
.rank .card:hover::before{-webkit-text-stroke-color:var(--accent)}

footer{position:relative;z-index:2;padding:40px 4vw 60px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;line-height:1.8}
footer strong{color:var(--gold)}
footer a{text-decoration:underline}

@media (max-width:700px){
  nav{gap:12px;padding:14px 16px}
  nav .links{display:none}
  .hero{height:72vh}
  .hero-copy{bottom:18vh;right:16px;left:16px}
  .dots{display:none}
  .row h2{padding:0 16px}
  .track{padding:24px 16px 32px}
  .card{flex-basis:70vw}
  .rank .card{flex-basis:62vw;margin-left:56px}
  .card:hover .inner{transform:scale(1.04)}
  #glow{display:none}
  footer{padding:32px 16px 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="glow"></div>
<nav id="nav">
  <div class="logo">ECO PLAY<small>GAESEONG HIGH</small></div>
  <div class="links"><a href="#hot">인기</a><a href="#ocean">바다</a><a href="#recycle">자원순환</a><a href="#climate">기후·생태</a><a href="#horror">스릴러</a></div>
  <div class="school">개성고등학교</div>
</nav>

<header class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-copy">
    <div class="badge"><b>개성고</b> ORIGINAL GAME</div>
    <h1 id="heroTitle"></h1>
    <p id="heroDesc"></p>
    <div class="btns">
      <a class="btn play" id="heroPlay">▶ 플레이</a>
      <a class="btn more" href="#all">ⓘ 전체 게임 보기</a>
    </div>
  </div>
  <div class="dots" id="dots"></div>
</header>

<main id="rows"></main>

<footer>
  <strong>개성고등학교</strong> 학생들이 직접 기획하고 만든 환경 게임 18편입니다.<br>
  각 게임의 저작권은 제작 학생에게 있으며, 게임 안의 저작권 표시를 따릅니다. 썸네일 이미지는 AI로 생성했습니다.<br>
  <a href="games-list.html">텍스트 목록으로 보기</a>
</footer>

<script>
const G=[
 ["01","우사기 백룸: E-Waste 호러 탈출","버려진 전자폐기물로 가득한 백룸에서 탈출하라.",["horror","recycle"]],
 ["02","Eco Slug: Biodiversity Guardian","숲을 노리는 사냥꾼들로부터 생물다양성을 지켜라.",["climate"]],
 ["03","탄소 타이쿤","돈도 벌고 탄소도 줄이는 친환경 경영 시뮬레이션.",["climate"]],
 ["04","생태계 디펜스: 외래종을 막아라!","토종 생태계를 위협하는 외래종을 막아내는 디펜스.",["climate"]],
 ["05","분리수거 몬스터즈: 업사이클 디펜스","재활용 몬스터를 키워 쓰레기 웨이브를 막아라.",["recycle"]],
 ["06","응애부터 흙까지: 걸어가는 인생 파노라마","태어나서 흙으로 돌아가기까지, 한 사람의 환경 발자국.",["climate"]],
 ["07","침수구역: 2100 — 생존 전략","해수면이 오른 2100년, 물에 잠긴 도시에서 살아남기.",["climate","horror"]],
 ["08","에코, 플리즈 - 분리수거소","분리수거 검문소의 깐깐한 검사관이 되어 보자.",["recycle"]],
 ["09","미세플라스틱 디펜스 클리너","바닷속 미세플라스틱을 쓸어버리는 슈팅 디펜스.",["ocean","recycle"]],
 ["10","닥터 모노머의 분자 레스토랑","분자를 조합해 요리하는 괴짜 과학자의 식당.",["recycle"]],
 ["11","부캉이를 찾아서","부산 북항의 밤바다, 1인칭 해중 수색 RPG.",["ocean"]],
 ["12","심해 정화 낚시","물고기 대신 쓰레기를 낚는 심해 정화 낚시.",["ocean"]],
 ["13","클린 오션 3D","3D 바다를 누비며 떠다니는 쓰레기를 치워라.",["ocean"]],
 ["14","체어맨 동진의 넷제로 대작전","회장님의 넷제로 경영, 회사를 초록으로 바꿔라.",["climate"]],
 ["15","개밤티 가재 피하기","몰려오는 외래종 가재를 피해 끝까지 버텨라.",["climate"]],
 ["16","블루 발라스트: 푸른 바다의 파수꾼","선박 평형수 속 침입종으로부터 바다를 지켜라.",["ocean"]],
 ["17","에코 뮤테이션 - The Horrific Dystopia","오염이 낳은 돌연변이 디스토피아의 공포.",["horror"]],
 ["18","백룸: 오염된 미로","오염수로 젖은 끝없는 미로를 빠져나가라.",["horror"]]
];
const by=id=>G.find(g=>g[0]===id);
const tagged=t=>G.filter(g=>g[3].includes(t)).map(g=>g[0]);
const ROWS=[
 ["hot","지금 개성고에서 가장 핫한 게임","TOP 10",["11","14","07","03","13","17","05","18","10","16"],true],
 ["ocean","푸른 바다를 지켜라","해양 보호",tagged("ocean")],
 ["recycle","버리지 말고 다시 쓰자","자원순환",tagged("recycle")],
 ["climate","기후와 생태계의 미래","기후·생태",tagged("climate")],
 ["horror","오싹한 환경 스릴러","호러·서바이벌",tagged("horror")],
 ["all","전체 게임 18편","모두 보기",G.map(g=>g[0])]
];
const thumb=n=>`thumbs/game-${n}.jpg`, href=n=>`game-${n}/index.html`;

const rows=document.getElementById("rows");
for(const [id,title,tag,ids,rank] of ROWS){
  const s=document.createElement("section");s.className="row"+(rank?" rank":"");s.id=id;
  s.innerHTML=`<h2>${title}<span>${tag} ›</span></h2><div class="track-wrap"><button class="arrow l" aria-label="이전">‹</button><div class="track"></div><button class="arrow r" aria-label="다음">›</button></div>`;
  const tr=s.querySelector(".track");
  ids.forEach((n,i)=>{const [,t,d]=by(n);const a=document.createElement("a");a.className="card";a.href=href(n);if(rank)a.dataset.rank=i+1;
    a.innerHTML=`<div class="inner"><img loading="lazy" src="${thumb(n)}" alt="${t} 썸네일"><span class="num">GAME ${n}</span><div class="shine"></div>
      <div class="info"><div class="t">${t}</div><div class="d">${d}</div><div class="go"><i>▶</i>지금 플레이</div></div></div>`;
    tr.appendChild(a)});
  s.querySelector(".l").onclick=()=>tr.scrollBy({left:-tr.clientWidth*.85});
  s.querySelector(".r").onclick=()=>tr.scrollBy({left:tr.clientWidth*.85});
  rows.appendChild(s);
}

// 카드 기울기 + 빛 반사
document.addEventListener("pointermove",e=>{
  const c=e.target.closest&&e.target.closest(".card");if(!c)return;
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");
  c.style.setProperty("--ry",(x-.5)*10+"deg");c.style.setProperty("--rx",(.5-y)*8+"deg");
});

// 커서 조명 + 히어로 패럴랙스
const glow=document.getElementById("glow"),bg=document.getElementById("heroBg");
addEventListener("pointermove",e=>{
  glow.style.left=e.clientX+"px";glow.style.top=e.clientY+"px";
  const dx=e.clientX/innerWidth-.5,dy=e.clientY/innerHeight-.5;
  bg.style.transform=`translate(${dx*-24}px,${dy*-16}px) scale(1.04)`;
});
addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("solid",scrollY>40));

// 히어로 자동 전환
const FEAT=["11","07","14","13","17"];let fi=0;const dots=document.getElementById("dots");
FEAT.forEach((_,i)=>{const d=document.createElement("i");d.onclick=()=>{fi=i;show()};dots.appendChild(d)});
function show(){const [n,t,d]=by(FEAT[fi]);bg.style.opacity=0;
  setTimeout(()=>{bg.style.backgroundImage=`url(${thumb(n)})`;bg.style.opacity=1},250);
  document.getElementById("heroTitle").textContent=t;document.getElementById("heroDesc").textContent=d;
  document.getElementById("heroPlay").href=href(n);
  [...dots.children].forEach((x,i)=>x.classList.toggle("on",i===fi));}
show();setInterval(()=>{fi=(fi+1)%FEAT.length;show()},7000);
</script>
</body>
</html>
