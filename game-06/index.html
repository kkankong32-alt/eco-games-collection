        // --- CANVAS RENDERER ---
        const cityScene=new Image();cityScene.src='assets/generated/city.png';
        const GameCanvas = ({ gameState, stats, profile, onMinigameEnd, timeStop, history }) => {
            const canvasRef = useRef(null);
            const requestRef = useRef();
            
            // Engine State
            const engine = useRef({
                scrollX: 0,
                playerY: 0,
                velocityY: 0,
                isJumping: false,
                items: [], // {x, y, type, active}
                score: 0,
                ecoDelta: 0,
                cameraPanX: 0 // For cinematic ending
            });

            // Age & Environment Derivations
            const ratio = useMemo(() => Math.min(stats.age / Math.max(stats.lifespan, 1), 1), [stats.age, stats.lifespan]);
            const ageStage = useMemo(() => {
                if (gameState === 'END') return 'ghost';
                if (stats.age <= 3) return 'baby';
                if (stats.age <= 13) return 'child';
                if (stats.age <= 19) return 'teen';
                if (stats.age <= 45) return 'adult';
                return 'senior';
            }, [stats.age, gameState]);

            const jump = useCallback(() => {
                if (gameState === 'MINIGAME' && !engine.current.isJumping) {
                    engine.current.velocityY = -16;
                    engine.current.isJumping = true;
                }
            }, [gameState]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [jump]);

            // Minigame Timer
            const [timeLeft, setTimeLeft] = useState(0);
            useEffect(() => {
                if (gameState === 'MINIGAME') {
                    setTimeLeft(timeStop ? 20 : 10);
                    engine.current.score = 0;
                    engine.current.ecoDelta = 0;
                    engine.current.items = [];
                    
                    const timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                onMinigameEnd(engine.current.score, engine.current.ecoDelta);
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [gameState, timeStop, onMinigameEnd]);

            // Drawing Loop
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                let lastTime = performance.now();

                const render = (time) => {
                    // Responsive sizing
                    canvas.width = canvas.clientWidth;
                    canvas.height = canvas.clientHeight;
                    
                    const W = canvas.width;
                    const H = canvas.height;
                    const dt = time - lastTime;
                    lastTime = time;

                    // Update physics & scrolling
                    let speed = 0;
                    if (gameState === 'PLAY' || gameState === 'MINIGAME' || gameState === 'SETUP') {
                        speed = (W * 0.0005) * dt; // Walk speed
                    } else if (gameState === 'END') {
                        speed = -(W * 0.001) * dt; // Pan backwards
                    }
                    engine.current.scrollX = (engine.current.scrollX + speed) % W;
                    engine.current.cameraPanX += speed;

                    // Minigame Logic
                    if (gameState === 'MINIGAME') {
                        engine.current.velocityY += 0.8; // Gravity
                        engine.current.playerY += engine.current.velocityY;
                        if (engine.current.playerY >= 0) {
                            engine.current.playerY = 0;
                            engine.current.velocityY = 0;
                            engine.current.isJumping = false;
                        }

                        // Spawn items

                    const eco=stats.eco;
if(cityScene.complete&&cityScene.naturalWidth){const th=H*.6,tw=th*1024/768,offset=(engine.current.cameraPanX*.2)%tw;ctx.save();for(let x=-offset;x<W;x+=tw){ctx.globalAlpha=1;ctx.drawImage(cityScene,0,0,1024,768,x,0,tw,th);ctx.globalAlpha=Math.max(0,Math.min(1,eco/100));ctx.drawImage(cityScene,1024,0,1024,768,x,0,tw,th);}ctx.restore();}else{// 2. Parallax Mountains/Cityscape
                    
                    const layer1Color = eco > 70 ? '#2d6a4f' : eco > 40 ? '#495057' : '#343a40';

                        } else if (eco > 40) {

                        } else {

                            // Smoke

                        }
                    }

                    }
// 4. The Street (Sidewalk & Road)
                    const sidewalkY = H * 0.6;
                    const roadY = H * 0.8;
                    
                    // Sidewalk
                    ctx.fillStyle = eco < 40 ? '#6c757d' : '#adb5bd'; // darker if polluted
                    ctx.fillRect(0, sidewalkY, W, H * 0.2);
                    // Pavement blocks

                    // Trash on sidewalk if low eco
                    if (eco < 40) {
                        ctx.fillStyle = '#000';
                        for(let i=0; i<5; i++) {
                            const tx = (i * 300 + 100 - engine.current.cameraPanX * 1) % W;
                            const finalTx = tx < 0 ? tx + W : tx;

                        }

                    if (eco < 40) {

                            item.x -= item.speed;

                            // Draw item
                            ctx.font = `${Math.floor(H*0.06)}px Arial`;
                            const icon = item.type === 'coin' ? '💰' : item.type === 'leaf' ? '🌿' : '🗑️';
                            ctx.fillText(icon, item.x, item.y);

                            // Collision
                            if (item.x < playerRect.x + playerRect.w && item.x + H*0.06 > playerRect.x &&
                                item.y - H*0.06 < playerRect.y + playerRect.h && item.y > playerRect.y) {
                                item.active = false;
                                if (item.type === 'coin') engine.current.score += (timeStop ? 200 : 100);

                        ctx.beginPath();
                        ctx.arc(charX + charW/2, cY + charH/2 + Math.sin(time*0.005)*10, charW/2, Math.PI, 0);

                        ctx.fill();
                        ctx.fillStyle = '#000'; // Eyes
                        ctx.fillRect(charX + charW*0.6, cY + charH*0.4 + Math.sin(time*0.005)*10, charW*0.1, charH*0.1);

                    } else {

                        ctx.translate(charX + charW/2, cY + charH*0.6); ctx.rotate(-legBob * Math.PI/180);
                        ctx.fillStyle = pants; ctx.fillRect(-charW*0.2, 0, charW*0.4, charH*0.4);

                        // Front Leg

                        ctx.setTransform(1,0,0,1,0,0);

                        // Body
                        ctx.fillStyle = shirt; ctx.fillRect(charX, cY + bob + charH*0.3, charW, charH*0.4);
                        
                        // Head
                        ctx.fillStyle = skin; ctx.fillRect(charX + charW*0.1, cY + bob, charW*0.8, charH*0.3);

                        }

                    if (gameState === 'MINIGAME') {

                    }

                    requestRef.current = requestAnimationFrame(render);
                };

                requestRef.current = requestAnimationFrame(render);
                return () => cancelAnimationFrame(requestRef.current);
            }, [gameState, stats.eco, ageStage, profile.gender, ratio, timeLeft, timeStop, onMinigameEnd]);

 EcoFX.notify("start","새 삶 시작. 선택 뒤 환경·행복·자금 변화를 함께 비교하세요.");

                                                    <div className="text-[10px] text-gray-600 font-bold leading-tight">{item.desc}</div>
                                                </div>
                                                <div className="flex justify-between items-center mt-2">
                                                    <span className="text-green-700 font-black text-xs">💰 {item.cost}</span>
                                                    <button onClick={() => buyItem(item)} className="bg-yellow-300 border border-black font-bold px-2 py-1 rounded text-xs hover:bg-yellow-400">구매</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* CINEMATIC ENDING PANORAMA OVERLAY */}
                        {gameState === 'END' && (
                            <div className="absolute inset-0 z-40 overflow-x-auto overflow-y-hidden custom-scrollbar flex items-center pt-20 px-[40vw] space-x-12 scroll-smooth">
                                {/* Auto-scroll to left script could be added, but manual scroll lets user reflect */}
                                {history.map((h, i) => (
                                    <div key={i} className="shrink-0 w-64 bg-white/90 backdrop-blur border-2 border-black p-4 rounded-xl shadow-xl flex flex-col gap-2">
                                        <div className="text-center border-b border-gray-300 pb-2">
                                            <span className="text-black font-black text-sm">{h.age}세</span>
                                        </div>
                                        <p className="font-bold text-xs text-gray-800 leading-tight h-10 overflow-hidden">{h.question}</p>
                                        <div className="bg-blue-100 p-2 rounded border border-blue-300 font-bold text-blue-900 text-xs text-center">
                                            "{h.choice}"
                                        </div>
                                    </div>
                                ))}
                                
                                {/* Final Tombstone */}
                                <div className="shrink-0 w-80 bg-gray-900 text-white border-4 border-gray-700 p-6 rounded-t-full rounded-b-xl shadow-2xl flex flex-col items-center text-center ml-24 relative">
                                    <h2 className="text-2xl font-black mb-2 mt-4">{stats.age}세 사망</h2>
                                    <div className="w-full h-px bg-gray-700 my-3" />
                                    <p className="font-bold text-gray-300 italic text-sm mb-4">
                                        {stats.eco < 30 ? '"매연 가득한 하늘을 뒤로하고 눈을 감다."' : 
                                         stats.eco >= 70 ? '"지구를 조금 더 푸르게 만들고 자연의 품으로 돌아가다."' :
                                         '"평범하지만 치열했던, 한 편의 파노라마."'}
                                    </p>
                                    <div className="grid grid-cols-2 gap-2 w-full text-xs font-bold mb-6">
                                        <div className="bg-gray-800 p-2 rounded">자연 {stats.eco}점</div>
                                        <div className="bg-gray-800 p-2 rounded">행복 {stats.hap}점</div>
                                        <div className="bg-gray-800 p-2 rounded">자산 ${stats.money}</div>
                                        <div className="bg-gray-800 p-2 rounded">건강 {stats.med}점</div>
                                    </div>
                                    <button onClick={initGame} className="w-full py-2 bg-red-600 hover:bg-red-500 font-black text-lg border-2 border-black rounded-lg">다시 태어나기 ↺</button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* BOTTOM PANEL (30%) */}
                    <div className={`w-full bg-[#f4f1ea] transition-all duration-1000 ease-in-out relative flex items-center justify-center
                        ${gameState === 'END' ? 'h-0 opacity-0' : 'h-[30%] opacity-100'}
                    `}>
                        {gameState === 'SETUP' && (
                            <div className="flex gap-4 items-center bg-white p-4 rounded-xl border-4 border-black shadow-lg">
                                <input type="text" value={profile.name} onChange={e => setProfile({...profile, name: e.target.value})} className="border-2 border-black p-2 rounded font-bold w-24 text-black text-sm" placeholder="이름" />
                                <select value={profile.gender} onChange={e => setProfile({...profile, gender: e.target.value})} className="border-2 border-black p-2 rounded font-bold text-black text-sm">
                                    <option value="Male">👦 남</option><option value="Female">👧 여</option><option value="Non-binary">🧑 중성</option>
                                </select>
                                <select value={profile.env} onChange={e => setProfile({...profile, env: e.target.value})} className="border-2 border-black p-2 rounded font-bold text-black text-sm">
                                    {Object.keys(ENVIRONMENTS).map(e => <option key={e} value={e}>{e}</option>)}
                                </select>
                                <button onClick={initGame} className="px-6 py-2 bg-blue-600 text-white font-black text-lg border-2 border-black rounded shadow-[2px_2px_0_0_#000] hover:translate-y-px">시작</button>
                            </div>
                        )}

                        {gameState === 'PLAY' && QUESTIONS[qIndex] && (
                            <div className="w-full max-w-4xl mx-auto px-6 flex flex-col gap-2 animate-fade-up">
                                <h3 className="text-base md:text-lg font-black text-gray-900 border-l-4 border-black pl-2 leading-tight">
                                    {QUESTIONS[qIndex].text}
                                </h3>
                                <div className="flex flex-row gap-2 overflow-x-auto py-1 custom-scrollbar">
                                    {QUESTIONS[qIndex].options.map((opt, i) => (
                                        <button 
                                            key={i}
                                            onClick={() => handleOption(opt, QUESTIONS[qIndex].text)}
                                            className="flex-1 min-w-[140px] text-left p-2 rounded-lg border-2 border-black font-bold text-xs md:text-sm bg-white text-black hover:bg-gray-100 shadow-[2px_2px_0_0_#000] hover:translate-y-px transition-transform whitespace-normal"
                                        >
                                            {opt.text}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                        
                        {gameState === 'MINIGAME' && (
                            <div className="text-center font-black text-gray-800 text-lg animate-fade-up">
                                미니게임 진행 중... (화면 클릭/스페이스바로 점프!)
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script>
EcoFX.mount({title:"삶의 선택과 환경",goal:"선택마다 달라지는 환경·행복·자금을 비교하고 다른 삶을 시도하세요.",note:"환경·수명·행복 수치는 이야기용 가상 규칙이며 개인의 실제 수명이나 건강을 예측하지 않습니다.",read:()=>({label:'환경 '+(window.ecoLife?.stats.eco??50)+' · 기록',progress:window.ecoLife?.stats.eco??50,detail:'환경 '+(window.ecoLife?.stats.eco??50)+' / 행복 '+(window.ecoLife?.stats.hap??50)+' — 선택의 이득과 비용을 함께 확인하세요.'}),actions:[]});
</script>
</body>
</html>
